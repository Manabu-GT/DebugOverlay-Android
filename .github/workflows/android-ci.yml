name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle + wrapper automatically
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Run checks (Spotless + Detekt + Lint + Tests), then merge SARIF reports
      # detekt is hooked into subproject `check` tasks, so it runs automatically
      # reportMerge must run after to collect all SARIF files
      - name: Run checks
        run: ./gradlew check mergedJacocoReport reportMerge --continue --stacktrace

      # Upload the JaCoCo reports as artifacts for easier access
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: build/reports/jacoco/mergedJacocoReport/
          retention-days: 30

      # Upload merged SARIF report to GitHub Code Scanning
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/merge.sarif

      - name: Build Project
        run: ./gradlew :sample:assembleDebug --stacktrace
