####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-jvm-android:2025.3
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
exclude:
  # Compose naming conventions (PascalCase for @Composable functions)
  - name: FunctionName
    paths:
      - debugoverlay-core/src/main/kotlin/com/ms/square/debugoverlay/internal/ui
      - debugoverlay-core/src/main/kotlin/com/ms/square/debugoverlay/internal/bugreport/ui
      - debugoverlay-core/src/debug/kotlin/com/ms/square/debugoverlay/internal/ui
  # Compose state assignments tracked by runtime
  - name: UnusedAssignment
    paths:
      - debugoverlay-core/src/main/kotlin/com/ms/square/debugoverlay/internal/ui
      - debugoverlay-core/src/main/kotlin/com/ms/square/debugoverlay/internal/bugreport/ui
      - debugoverlay-core/src/debug/kotlin/com/ms/square/debugoverlay/internal/ui
  # Dependency updates managed by Renovate
  - name: AndroidLintGradleDependency
  - name: AndroidLintAndroidGradlePluginVersion
  - name: AndroidLintNewerVersionAvailable
  # Sample app not part of library
  - name: All
    paths:
      - sample
bootstrap: ./gradlew :debugoverlay-core:compileDebugKotlin --no-daemon
