####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-jvm-android:2025.3
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
exclude:
  - name: FunctionName
    paths:
      - "**/ui/**"
  - name: UnusedAssignment
    paths:
      - "**/ui/**"
  # Dependency updates managed by Renovate
  - name: GradleDependency
  - name: AndroidGradlePluginVersion
  - name: NewerLibraryVersionsAvailable
  # Sample app not part of library
  - name: All
    paths:
      - "sample/**"
baseline: qodana.sarif.json
bootstrap: ./gradlew :debugoverlay-core:assembleDebug --no-daemon
